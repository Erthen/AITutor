<!DOCTYPE html>
<html>
<head>
  <title>AI Tutor</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    video { width: 400px; border-radius: 10px; }
  </style>
</head>
<body>
  <h2>AI Tutor Live Teaching</h2>

  <video id="avatarVideo" controls autoplay></video>
  <br><br>

  <input id="question" placeholder="Ask anything..." style="width:300px">
  <button onclick="askTutor()">Ask Tutor</button>

  <script>
    async function askTutor() {
      const question = document.getElementById("question").value;

      const response = await fetch("/teach", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: question })
      });

      const data = await response.json();
      const video = document.getElementById("avatarVideo");
      video.src = data.video_url;
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Tutor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    #chat-box {
      width: 100%;
      height: 400px;
      background: white;
      border: 1px solid #ccc;
      padding: 15px;
      overflow-y: auto;
    }
    #userInput {
      width: 80%;
      padding: 10px;
      margin-top: 10px;
    }
    #sendBtn {
      padding: 10px 15px;
      cursor: pointer;
    }
    video {
      width: 350px;
      margin-top: 15px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <h2>AI Tutor with HeyGen Avatar</h2>
  <div id="chat-box"></div>

  <input type="text" id="userInput" placeholder="Ask a question...">
  <button id="sendBtn">Send</button>

  <script>
    document.getElementById("sendBtn").onclick = async function () {
      const question = document.getElementById("userInput").value;
      if (!question) return;

      document.getElementById("chat-box").innerHTML += `<p><b>You:</b> ${question}</p>`;

      const response = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question })
      });

      const data = await response.json();

      document.getElementById("chat-box").innerHTML += `<p><b>AI Tutor:</b> ${data.text}</p>`;

      if (data.videoUrl) {
        document.getElementById("chat-box").innerHTML += `
          <video controls src="${data.videoUrl}"></video>
        `;
      }

      document.getElementById("userInput").value = "";
    };
  </script>

</body>
</html>
